    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 24px 16px; line-height: 1.5; }
    .app-container { max-width: 1250px; margin: 0 auto; }

    h1 { font-size: 26px; font-weight: 700; margin-top: 6px; }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

    textarea { width: 100%; padding: 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px; resize: vertical; outline: none; margin: 10px 0; min-height: 85px; }
    textarea:focus { border-color: var(--accent); }

    .preset-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .chip-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }

    .chip:hover { border-color: var(--accent); color: #fff; background: rgba(99, 102, 241, 0.2); }

    .btn-primary { width: 100%; padding: 12px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; }
    .btn-primary:hover { background: var(--accent-hover); }

    .conclusion-card { border-left: 4px solid var(--accent); background: #131d33; }
    .conclusion-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .status-pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
    .status-safe { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .status-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .status-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

    .conclusion-box { background: var(--bg-card); padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); }
    .conclusion-box span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 8px; font-weight: 700; }

    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
    input, select { width: 100%; padding: 9px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 13px; outline: none; }

    .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .stat-value { font-size: 16px; font-weight: 700; margin-top: 4px; }
